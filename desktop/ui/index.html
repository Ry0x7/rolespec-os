<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoleSpec</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #09090f;
        color: #f5f3ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      .mark {
        display: inline-flex;
        width: 3rem;
        height: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        background: #6d28d9;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      p {
        color: #a1a1aa;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">R</div>
      <h1>RoleSpec</h1>
      <p>
        This is the bundled fallback page. The desktop shell opens the local
        RoleSpec server once it is ready.
      </p>
    </main>
  </body>
</html>
