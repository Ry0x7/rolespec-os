name: Desktop

# Windows builds the NSIS installer that tag builds publish as a GitHub release.
# macOS builds an unsigned .app/.dmg and smoke-tests it, but uploads it as a
# workflow artifact only: without an Apple Developer ID the bundle cannot pass
# Gatekeeper, and the updater manifest has no darwin entry, so a published
# macOS build could neither install normally nor self-update. The macOS job is
# the CI guard for the cross-platform runtime until signing exists.
#
# The executable records Chryypt as its CompanyName, but Windows treats any
# unsigned binary as an unknown publisher; file metadata cannot establish
# Authenticode trust. See docs/DESKTOP.md.
#
# TAURI_SIGNING_PRIVATE_KEY, when configured, additionally produces the
# Windows updater archive signature and a channel manifest: `latest.json` for a
# stable tag, `latest-beta.json` for a prerelease tag such as v2.2.0-beta.1.
# Beta tags publish as prereleases and update the rolling `beta` release, which
# is the beta channel endpoint. That signature protects updates; it is unrelated
# to Windows SmartScreen.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # `npm ci` runs `prisma generate` (no connection) and `next build` needs the
  # same non-secret placeholders the main CI uses. Nothing here reaches a real
  # database or signs a real session.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  AUTH_SECRET: ci-build-only-secret-not-used-to-sign-anything
  # Baked into the client bundle. The shell opens http://127.0.0.1:3100, so
  # absolute links must use that origin rather than localhost:3000.
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  installer:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A prerelease tag is the beta channel. The release and manifest steps
      # below use this value; the manifest step still ignores non-tag refs.
      - name: Detect release channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            channel=beta
          else
            channel=stable
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Release channel: $channel"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Fetches the SHA-256-pinned PostgreSQL 17 archive and extracts only the
      # runtime directories. ~250 MB; cached by the runner is not guaranteed.
      - name: Fetch bundled PostgreSQL
        run: npm run desktop:postgres

      - name: Shell tests
        run: npm run desktop:test

      # Builds the standalone server with DESKTOP_BUILD=1 (distDir
      # .next-desktop) and stages the Node runtime, Prisma CLI and migrations.
      - name: Stage desktop runtime
        run: |
          node --test scripts/desktop/runtime-links.test.mjs
          npm run desktop:build

      # The npm CLI avoids compiling tauri-cli from source. It reads
      # desktop/src-tauri/tauri.conf.json, whose bundle.resources includes the
      # staged runtime. `createUpdaterArtifacts` is off in the committed config
      # so a local build needs no key; the overlay turns it on when this run has
      # one, which is what produces the `.nsis.zip` and its `.sig`.
      - name: Build NSIS installer
        working-directory: desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(build --bundles nsis)
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
            echo "Updater artifacts enabled."
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; this build has no updater artifacts and installed copies cannot self-update."
          fi
          npx --yes @tauri-apps/cli@^2 "${args[@]}"

      - name: Verify publisher metadata
        shell: pwsh
        run: |
          $binaries = @(Get-Item 'desktop/src-tauri/target/release/rolespec-desktop.exe')
          $binaries += @(Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*.exe')
          if ($binaries.Count -ne 2) { throw 'Expected one application and one installer' }
          foreach ($binary in $binaries) {
            if ($binary.VersionInfo.CompanyName -ne 'Chryypt Inc') {
              throw "Incorrect CompanyName in $($binary.Name): $($binary.VersionInfo.CompanyName)"
            }
            Write-Output "$($binary.Name): CompanyName=$($binary.VersionInfo.CompanyName)"
          }

      # The app reads `releases/latest/download/latest.json` on the stable
      # channel and the rolling `beta` release's `latest-beta.json` on beta; the
      # CLI does not write either, so the workflow does. The signature is the one
      # covering the installer, and `requireSignedVersion` binds it to this
      # version number.
      - name: Write the update manifest
        shell: bash
        working-directory: desktop/src-tauri/target/release/bundle/nsis
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          manifest=latest.json
          if [ "$CHANNEL" = beta ]; then manifest=latest-beta.json; fi

          exe=$(ls -1 -- *.exe 2>/dev/null | head -n 1 || true)
          if [ -z "$exe" ]; then
            echo "::warning::No installer; $manifest is not written."
            exit 0
          fi
          if [ ! -f "$exe.sig" ]; then
            echo "::warning::$exe has no signature; $manifest is not written."
            exit 0
          fi
          # `GITHUB_REF_NAME` is set for branches too (a manual run on main is
          # "main"), so the ref type has to be checked, not just non-emptiness.
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "::warning::Not a tag build ($GITHUB_REF_TYPE $GITHUB_REF_NAME); $manifest is not written."
            exit 0
          fi

          version=$(node -e 'console.log(require(process.argv[1]).version)' "$GITHUB_WORKSPACE/desktop/src-tauri/tauri.conf.json")
          # One line on purpose: a `\` continuation here would be easy to break.
          node "$GITHUB_WORKSPACE/scripts/desktop/write-update-manifest.mjs" "$exe" "$exe.sig" "$version" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$CHANNEL"

      - name: Checksum the installer
        shell: bash
        run: |
          cd desktop/src-tauri/target/release/bundle/nsis
          sha256sum ./*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Exercise the exact installer bytes that will be published. The app is
      # launched with a redirected LOCALAPPDATA so the runner profile and its
      # data directory are not touched.
      - name: Smoke test the installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/RoleSpec_*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          ./scripts/desktop/smoke-installer.ps1 -InstallerPath $installer.FullName

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: rolespec-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/nsis/latest*.json
            desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # Tag builds publish directly. Stable tags update `latest.json`; beta
      # tags publish as prereleases and update the rolling `beta` release.
      # Releases are unsigned, so Windows may warn about them.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          echo "Publishing $GITHUB_REF_NAME on the $CHANNEL channel."

          cd desktop/src-tauri/target/release/bundle/nsis
          manifest=latest.json
          if [ "$CHANNEL" = beta ]; then manifest=latest-beta.json; fi

          assets=()
          for file in ./*.exe ./*.sig ./SHA256SUMS.txt; do
            [ -e "$file" ] && assets+=("$file")
          done
          # The channel manifest is written only when the updater key produced
          # a `.sig`, so its presence already implies a verifiable archive.
          if [ -f "./$manifest" ]; then
            assets+=("./$manifest")
          fi

          prerelease=()
          if [ "$CHANNEL" = beta ]; then prerelease+=(--prerelease); fi

          # Re-running a failed job for the same tag must not fail on an
          # existing release: replace its assets and publish it again.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false "${prerelease[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${prerelease[@]}" \
              --generate-notes --title "RoleSpec OS $GITHUB_REF_NAME"
          fi

          # The beta channel is a fixed URL, so it needs a rolling release.
          # A stable release also refreshes it: a beta user on an older
          # prerelease must be offered the newer stable build.
          if [ ! -f "./$manifest" ]; then
            echo "::warning::No $manifest; the $CHANNEL channel pointer was not updated."
            exit 0
          fi

          beta_manifest=latest-beta.json
          if [ "$CHANNEL" = stable ]; then
            cp "$manifest" "$beta_manifest"
          fi

          if gh release view beta >/dev/null 2>&1; then
            gh release upload beta "./$beta_manifest" --clobber
            gh release edit beta --prerelease --title "RoleSpec OS beta channel"
          else
            gh release create beta "./$beta_manifest" --prerelease \
              --title "RoleSpec OS beta channel" \
              --notes "Rolling beta channel manifest. Switch to the beta channel in Settings → Preferences → Desktop updates."
          fi

  installer-macos:
    name: macOS arm64 app + smoke test
    # macOS 14 images were retired on 2 November 2026; macos-15 is the current
    # GA arm64 image.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # The universal EDB macOS archive is 436 MB compressed and changes only
      # with the pinned version, so cache it across runs.
      - name: Cache bundled PostgreSQL
        uses: actions/cache@v6
        with:
          path: desktop/vendor
          key: postgres-17.11-1-osx-universal

      - name: Fetch bundled PostgreSQL
        run: npm run desktop:postgres

      - name: Shell tests
        run: npm run desktop:test

      - name: Stage desktop runtime
        run: |
          node --test scripts/desktop/runtime-links.test.mjs
          npm run desktop:build

      # tauri.macos.conf.json supplies the app + dmg targets and icon.icns;
      # --bundles keeps the artifact paths independent of future config edits.
      # There is no signing identity, so the bundle is ad-hoc signed at most;
      # it still runs locally (no quarantine) which is all the smoke test needs.
      - name: Build macOS app and DMG
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --bundles app,dmg

      # A startup error shows a native dialog, which would wait forever on a
      # runner; the timeout turns that into a failed step instead.
      - name: Smoke test the DMG
        timeout-minutes: 12
        run: |
          set -euo pipefail
          dmg=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          bash scripts/desktop/smoke-dmg.sh "$dmg"

      - name: Checksum the DMG
        run: |
          set -euo pipefail
          cd desktop/src-tauri/target/release/bundle/dmg
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Artifact only on purpose. Publishing needs Developer ID signing and
      # notarization; see the header comment.
      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: rolespec-macos-arm64
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
