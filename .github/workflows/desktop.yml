name: Desktop (Windows)

# The desktop runtime is Windows-only: the staging script pins Windows x64
# PostgreSQL binaries and the shell targets NSIS. Linux/macOS jobs would need
# their own pinned runtimes, so they are out of scope until requested.
#
# Two independent credentials decide what this workflow can ship:
#
#   1. Azure Artifact Signing (6 secrets/variables) signs the setup executable.
#      With it, a tag build publishes the release; without it, the build warns,
#      stays unsigned and the release stays a draft.
#   2. TAURI_SIGNING_PRIVATE_KEY signs the update artifact. With it, the build
#      also produces `<installer>.sig` and a `latest.json`, which is what an
#      installed copy checks for updates.
#
# See "Signing Windows releases" in README.md for the setup.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # `npm ci` runs `prisma generate` (no connection) and `next build` needs the
  # same non-secret placeholders the main CI uses. Nothing here reaches a real
  # database or signs a real session.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  AUTH_SECRET: ci-build-only-secret-not-used-to-sign-anything
  # Baked into the client bundle. The shell opens http://127.0.0.1:3100, so
  # absolute links must use that origin rather than localhost:3000.
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  installer:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      # Used only by `azure/login` when signing is configured. GitHub rejects a
      # workflow that requests an OIDC token without this permission, and an
      # unused permission is harmless.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Fetches the SHA-256-pinned PostgreSQL 17 archive and extracts only the
      # runtime directories. ~250 MB; cached by the runner is not guaranteed.
      - name: Fetch bundled PostgreSQL
        run: npm run desktop:postgres

      - name: Shell tests
        run: npm run desktop:test

      # Builds the standalone server with DESKTOP_BUILD=1 (distDir
      # .next-desktop) and stages the Node runtime, Prisma CLI and migrations.
      - name: Stage desktop runtime
        run: npm run desktop:build

      # The npm CLI avoids compiling tauri-cli from source. It reads
      # desktop/src-tauri/tauri.conf.json, whose bundle.resources includes the
      # staged runtime. `createUpdaterArtifacts` is off in the committed config
      # so a local build needs no key; the overlay turns it on when this run has
      # one, which is what produces the `.nsis.zip` and its `.sig`.
      - name: Build NSIS installer
        working-directory: desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(build --bundles nsis)
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
            echo "Updater artifacts enabled."
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; this build has no updater artifacts and installed copies cannot self-update."
          fi
          npx --yes @tauri-apps/cli@^2 "${args[@]}"

      # Secrets cannot be tested in a step `if:`, so they are read here and
      # turned into an output. A missing value in any slot means "unsigned";
      # the warning is visible in the run summary rather than failing the job.
      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          SIGN_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGN_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGN_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGN_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          missing=""
          for name in SIGN_CLIENT_ID SIGN_TENANT_ID SIGN_SUBSCRIPTION_ID \
                      SIGN_ENDPOINT SIGN_ACCOUNT SIGN_PROFILE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing enabled: Azure Artifact Signing."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Installer will be UNSIGNED (missing:$missing). SmartScreen will warn about it."
          fi

      - name: Authenticate to Azure
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Signs the finished setup.exe in place. The signature is timestamped
      # against Microsoft's RFC 3161 endpoint because Artifact Signing
      # certificates are short-lived. Signing happens after bundling so the
      # bytes users download are the bytes that were signed; the checksum below
      # is therefore computed afterwards.
      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\desktop\src-tauri\target\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A signing step that reports success is not proof the artifact verifies.
      # Publishing is gated on this step: an untimestamped or broken signature
      # fails the build instead of shipping.
      - name: Verify signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $installers = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer to sign, found $($installers.Count)."
          }
          $installer = $installers[0]
          $sig = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          Write-Host "$($installer.Name): $($sig.Status) by $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer signature is $($sig.Status), expected Valid." }
          if ($null -eq $sig.TimeStamperCertificate) { throw "Installer signature is not timestamped." }
          if ($installer.Length -lt 1MB) { throw "Signed installer is suspiciously small." }

      # Authenticode changes the bytes, which invalidates the `.sig` the
      # bundler produced. Tauri v2's NSIS updater installs the setup.exe
      # directly (or a zip containing it), so the signature has to cover the
      # signed executable; `signer sign` rewrites `<exe>.sig` and records the
      # version that `requireSignedVersion` checks at runtime.
      - name: Re-sign the update artifact
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        working-directory: desktop/src-tauri/target/release/bundle/nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "No updater key; the installer is signed but cannot ship updates."
            exit 0
          }
          $exe = Get-ChildItem *.exe | Select-Object -First 1
          Remove-Item "$($exe.FullName).sig" -ErrorAction SilentlyContinue
          npx --yes '@tauri-apps/cli@^2' signer sign $exe.FullName
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw "The update artifact was not signed." }
          $comment = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content $sig -Raw).Trim()))
          if ($comment -notmatch "version:") {
            throw "The update signature has no trusted version comment, so every client would reject it."
          }

      # The app reads `releases/latest/download/latest.json`; the CLI does not
      # write it, so the workflow does. The signature is the one covering the
      # installer, and `requireSignedVersion` binds it to this version number.
      - name: Write the update manifest
        shell: bash
        working-directory: desktop/src-tauri/target/release/bundle/nsis
        run: |
          set -euo pipefail
          exe=$(ls -1 -- *.exe 2>/dev/null | head -n 1 || true)
          if [ -z "$exe" ]; then
            echo "::warning::No installer; latest.json is not written."
            exit 0
          fi
          if [ ! -f "$exe.sig" ]; then
            echo "::warning::$exe has no signature; latest.json is not written."
            exit 0
          fi
          # `GITHUB_REF_NAME` is set for branches too (a manual run on main is
          # "main"), so the ref type has to be checked, not just non-emptiness.
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "::warning::Not a tag build ($GITHUB_REF_TYPE $GITHUB_REF_NAME); latest.json is not written."
            exit 0
          fi

          version=$(node -e 'console.log(require(process.argv[1]).version)' "$GITHUB_WORKSPACE/desktop/src-tauri/tauri.conf.json")
          # One line on purpose: a `\` continuation here would be easy to break.
          node "$GITHUB_WORKSPACE/scripts/desktop/write-update-manifest.mjs" "$exe" "$exe.sig" "$version" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Checksum the installer
        shell: bash
        run: |
          cd desktop/src-tauri/target/release/bundle/nsis
          sha256sum ./*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: rolespec-windows-x64-${{ steps.signing.outputs.enabled == 'true' && 'signed' || 'unsigned' }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json
            desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # Signed + verified builds publish. Anything else stays a draft: an
      # unsigned NSIS installer is blocked by SmartScreen, so making it public
      # remains a deliberate manual decision.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          draft_flag=--draft
          if [ "$SIGNED" = "true" ]; then
            draft_flag=""
            echo "Signed installer verified; publishing $GITHUB_REF_NAME."
          else
            echo "Unsigned installer; creating a draft release."
          fi

          cd desktop/src-tauri/target/release/bundle/nsis
          assets=()
          for file in ./*.exe ./*.sig ./SHA256SUMS.txt; do
            [ -e "$file" ] && assets+=("$file")
          done
          # `latest.json` must only be attached when it describes a signed
          # archive, otherwise installed copies would download an unverifiable
          # update and fail.
          if [ -f ./latest.json ] && [ "$SIGNED" = "true" ]; then
            assets+=(./latest.json)
          fi

          # Re-running a failed job for the same tag must not fail on an
          # existing release: replace its assets and promote or demote it to
          # match this run's signing outcome.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            if [ -z "$draft_flag" ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              $draft_flag --generate-notes --title "RoleSpec $GITHUB_REF_NAME"
          fi
