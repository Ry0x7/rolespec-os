name: Deploy RoleSpec OS showcase

# The showcase is built from main on every push that touches it, so the live
# site can never go stale behind main (previously this workflow published the
# gh-pages branch by hand, with no build step).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/showcase/**"
      - "scripts/build-showcase.ts"
      - "scripts/verify-showcase.mjs"
      - "scripts/test-showcase.mjs"
      - "screenshots/**"
      - "public/banner.svg"
      - "public/icon.svg"
      - ".github/workflows/showcase.yml"
  # Pull requests build and test the showcase but never deploy it.
  pull_request:
    paths:
      - "package.json"
      - "src/showcase/**"
      - "scripts/build-showcase.ts"
      - "scripts/verify-showcase.mjs"
      - "scripts/test-showcase.mjs"
      - "screenshots/**"
      - "public/banner.svg"
      - "public/icon.svg"
      - ".github/workflows/showcase.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rolespec-showcase-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build showcase
        run: npm run showcase:build

      - name: Verify showcase output
        run: node scripts/verify-showcase.mjs

      - name: Install Chromium for the demo test
        run: npx playwright install --with-deps chromium

      - name: Test the live demo in a browser
        run: npm run showcase:test

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist-showcase

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish showcase
        id: deployment
        uses: actions/deploy-pages@v5
