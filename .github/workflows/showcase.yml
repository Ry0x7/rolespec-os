name: Deploy RoleSpec OS showcase

# The showcase is built from main on every push that touches it, so the live
# site can never go stale behind main (previously this workflow published the
# gh-pages branch by hand, with no build step).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/showcase/**"
      - "scripts/build-showcase.ts"
      - "scripts/verify-showcase.mjs"
      - "screenshots/**"
      - "public/banner.svg"
      - ".github/workflows/showcase.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rolespec-showcase-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build showcase
        run: npm run showcase:build

      - name: Verify showcase output
        run: node scripts/verify-showcase.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-showcase

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish showcase
        id: deployment
        uses: actions/deploy-pages@v5
