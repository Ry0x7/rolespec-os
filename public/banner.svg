<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>
    
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="indigo-glow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.18"/>
    </linearGradient>

    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="140" r="260" fill="url(#cyan-glow)" filter="url(#blur-filter)"/>
  <circle cx="1020" cy="280" r="300" fill="url(#indigo-glow)" filter="url(#blur-filter)"/>

  <!-- Subtle Grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1280" y2="70" />
    <line x1="0" y1="140" x2="1280" y2="140" />
    <line x1="0" y1="210" x2="1280" y2="210" />
    <line x1="0" y1="280" x2="1280" y2="280" />
    <line x1="0" y1="350" x2="1280" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1120" y1="0" x2="1120" y2="420" />
  </g>

  <!-- Subtle Border -->
  <rect x="1" y="1" width="1278" height="418" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Content Group -->
  <g transform="translate(80, 68)">
    
    <!-- Top Pill: Zero API Key Badge -->
    <g transform="translate(0, 0)">
      <rect width="360" height="32" rx="16" fill="url(#badge-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#bae6fd" letter-spacing="0.5">
        ZERO API KEYS NEEDED • FREE &amp; OPEN SOURCE
      </text>
    </g>

    <!-- Main Title with Icon -->
    <g transform="translate(0, 56)">
      <!-- Icon Graphic -->
      <g transform="translate(0, 6)">
        <rect width="56" height="56" rx="14" fill="url(#logo-grad)"/>
        <!-- Document / AI Target Symbol inside Icon -->
        <path d="M18 17H34C35.1 17 36 17.9 36 19V37C36 38.1 35.1 39 34 39H18C16.9 39 16 38.1 16 37V19C16 17.9 16.9 17 18 17Z" fill="#0b1120" fill-opacity="0.85"/>
        <line x1="21" y1="23" x2="31" y2="23" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
        <line x1="21" y1="28" x2="29" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
        <line x1="21" y1="33" x2="26" y2="33" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
        <circle cx="37" cy="37" r="7" fill="#38bdf8" stroke="#0b1120" stroke-width="2"/>
        <path d="M35 37L36.5 38.5L39.5 35.5" stroke="#0b1120" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- App Title -->
      <text x="74" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="800" fill="url(#title-grad)" letter-spacing="-1.5">
        RoleSpec
      </text>
      <text x="312" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="2">
        OS
      </text>
    </g>

    <!-- Subtitle / Value Proposition -->
    <g transform="translate(0, 150)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#f1f5f9">
        The Autonomous Job-Seeking Operating System
      </text>
      <text y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
        Tailor resumes to any job description, reverse-engineer ATS filters, and track every application in your private workspace.
      </text>
    </g>

    <!-- Feature Feature Badges Row -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: Codex & Claude -->
      <g transform="translate(0, 0)">
        <rect width="255" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
          ⚡ Connects to Codex &amp; Claude Code
        </text>
      </g>

      <!-- Badge 2: ATS Scanner -->
      <g transform="translate(267, 0)">
        <rect width="200" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
          🎯 Real-Time ATS Scoring
        </text>
      </g>

      <!-- Badge 3: Chrome Extension -->
      <g transform="translate(479, 0)">
        <rect width="200" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
          🧩 1-Click Job Clipper (MV3)
        </text>
      </g>

      <!-- Badge 4: Self-Hosted / AGPL -->
      <g transform="translate(691, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
          🔒 100% Private (Docker)
        </text>
      </g>
    </g>
  </g>
</svg>
