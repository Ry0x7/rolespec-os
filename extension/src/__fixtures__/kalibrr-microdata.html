<!doctype html>
<!--
  Shape observed on www.kalibrr.com 2026-09-14: no JobPosting JSON-LD at all, the
  employer only in a hidden microdata block, the address itemised inside the same
  element that also renders it as text, and a seniority band in the heading where
  a company name would normally sit.
-->
<html lang="en">
  <head>
    <title>Web Developer | Junior to Mid Job Openings at Squadzip (Digital Space Explorer, Inc.)</title>
    <meta
      property="og:title"
      content="Web Developer | Junior to Mid at Squadzip (Digital Space Explorer, Inc.)"
    />
  </head>
  <body>
    <h1>Web Developer | Junior to Mid</h1>
    <div itemscope itemtype="http://schema.org/Organization" itemprop="hiringOrganization" class="k-hidden">
      <meta itemprop="name" content="Squadzip (Digital Space Explorer, Inc.)" />
      <meta itemprop="url" content="https://www.kalibrr.com/c/squadzip-digital-space-explorer-inc/jobs" />
    </div>
    <div itemprop="jobLocation" itemscope itemtype="http://schema.org/Place">
      5th Floor Microlab Building, Makati, National Capital Region (Metro Manila), Philippines
      <span itemprop="addressLocality">Makati</span>
      <span itemprop="addressRegion">National Capital Region (Metro Manila)</span>
      <span itemprop="addressCountry">Philippines</span>
    </div>
  </body>
</html>
